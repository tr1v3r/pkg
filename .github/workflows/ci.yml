name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # exact pin: future 2.x releases may add checks that break the gate
          version: v2.12.2

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Run tests with coverage
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Report total coverage
        run: go tool cover -func=coverage.out | tail -1

  redis:
    name: Redis integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run real Redis lease tests with race detector
        env:
          PKG_LOCK_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -count=1 -tags=integration ./lock/...
