version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  build-tags:
    - integration
    - demo

linters:
  settings:
    gocritic:
      enabled-tags:
        - performance
        - style
      disabled-checks:
        # These opinionated checks fight the library's deliberate value-semantics
        # design (log.Record passed by value) and existing doc-comment style.
        - hugeParam
        - rangeValCopy
        - docStub
        - paramTypeCombine
        - unnamedResult
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 120
    goconst:
      min-len: 3
      min-occurrences: 3
    govet:
      enable-all: true
      # fieldalignment/inline are officially "opinionated" analyzers: reordering
      # dozens of struct fields buys nothing in a utility library.
      disable:
        - fieldalignment
        - inline
      settings:
        printf:
          funcs:
            - (github.com/tr1v3r/pkg/log.Logger).Infof
            - (github.com/tr1v3r/pkg/log.Logger).Warnf
            - (github.com/tr1v3r/pkg/log.Logger).Errorf
            - (github.com/tr1v3r/pkg/log.Logger).Fatalf
            - (github.com/tr1v3r/pkg/log.Logger).Debugf
            - (github.com/tr1v3r/pkg/log.Logger).Tracef
    lll:
      line-length: 120
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104 # errors unhandled (errcheck covers it)
        - G115 # integer overflow conversion (common in SDK)
        - G204 # subprocess launching with tainted input (SDK flexibility)
        - G304 # file path from taint source (SDK flexibility)

  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - dupl
    - goconst
    - gocritic
    - gosec
    - misspell
    - prealloc
    - bodyclose
    - dogsled
    - nakedret
    - unconvert

  exclusions:
    rules:
      # Relaxed rules for test files
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
          - goconst
          - gosec
          - errcheck
          - prealloc
          - ineffassign
          - dogsled
          - nakedret
          - gocritic
          - bodyclose
      # calendar serialization/parsing is legitimately branchy
      - path: calendar/
        linters:
          - gocyclo
      # British spellings kept on purpose: CANCELLED is the RFC 5545 status
      # literal (iCalendar spec), and guard.Cancelled() is an exported API.
      - linters:
          - misspell
        text: '(?i)cancelled'
      # Relaxed rules for example/demo files
      - path: (.*demo/.*\.go|.*example/.*\.go)
        linters:
          - gocyclo
          - dupl
          - goconst
          - gosec
          - errcheck
          - prealloc
          - ineffassign

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
