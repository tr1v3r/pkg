version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly
  build-tags:
    - integration
    - demo

linters:
  # Alphabetical; one quality concern per linter.
  enable:
    - bodyclose      # HTTP response bodies always closed
    - dogsled        # too many blank identifiers
    - dupl           # duplicated code (threshold below)
    - errcheck       # unchecked errors
    - gocritic       # curated perf/style checks (see disabled-checks)
    - gocyclo        # cyclomatic complexity
    - goconst        # repeated string literals
    - gosec          # security
    - govet          # standard vet, all analyzers
    - ineffassign    # ineffectual assignments
    - lll            # line length
    - misspell       # typos
    - nakedret       # naked returns
    - prealloc       # slice preallocation
    - staticcheck    # staticcheck + stylecheck
    - unconvert      # redundant conversions
    - unused         # unused code

  settings:
    gocritic:
      enabled-tags:
        - performance
        - style
      disabled-checks:
        # Opinionated checks that fight this library's deliberate
        # value-semantics design (log.Record passed by value) and its
        # doc-comment style.
        - hugeParam
        - rangeValCopy
        - docStub
        - paramTypeCombine
        - unnamedResult
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 120
    goconst:
      min-len: 3
      min-occurrences: 3
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104 # errors unhandled (errcheck owns that signal)
        - G115 # integer overflow conversion (common in SDK)
        - G204 # subprocess launching with tainted input (SDK flexibility)
        - G304 # file path from taint source (SDK flexibility)
    govet:
      enable-all: true
      # fieldalignment/inline are officially "opinionated" analyzers:
      # reordering dozens of struct fields buys nothing in a utility library.
      disable:
        - fieldalignment
        - inline
      settings:
        printf:
          funcs:
            - (github.com/tr1v3r/pkg/log.Logger).Infof
            - (github.com/tr1v3r/pkg/log.Logger).Warnf
            - (github.com/tr1v3r/pkg/log.Logger).Errorf
            - (github.com/tr1v3r/pkg/log.Logger).Fatalf
            - (github.com/tr1v3r/pkg/log.Logger).Debugf
            - (github.com/tr1v3r/pkg/log.Logger).Tracef
    lll:
      line-length: 120
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true

  exclusions:
    # Generated code is excluded except for compile errors.
    generated: lax
    paths:
      - vendor$
      - third_party$
      - testdata$
      - examples$
    rules:
      # Test files: relaxed — they verify behavior, not style.
      - path: _test\.go
        linters:
          - bodyclose
          - dogsled
          - dupl
          - errcheck
          - gocritic
          - gocyclo
          - goconst
          - gosec
          - ineffassign
          - lll
          - nakedret
          - prealloc
      # calendar serialization/parsing is legitimately branchy.
      - path: calendar/
        linters:
          - gocyclo
      # British spellings kept on purpose: CANCELLED is the RFC 5545 status
      # literal (iCalendar spec), and guard.Cancelled() is an exported API.
      - linters:
          - misspell
        text: '(?i)cancelled'
      # Example/demo code is illustrative, not production.
      - path: (.*demo/.*\.go|.*example/.*\.go)
        linters:
          - dupl
          - errcheck
          - gocyclo
          - goconst
          - gosec
          - ineffassign
          - prealloc

# Formatting is checked by 'run' and auto-fixed by 'golangci-lint fmt'.
# Mirrors the project's goimports-reviser setup (make format): stdlib and
# third-party groups, then github.com/tr1v3r/pkg last.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/tr1v3r/pkg
  exclusions:
    generated: lax
    paths:
      - vendor$
      - third_party$
      - testdata$
      - examples$

issues:
  # Do not cap reported findings; the gate is zero issues.
  max-issues-per-linter: 0
  max-same-issues: 0
